[package]
name = "veles"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
logos = "0.16.1"
rustyline = "18.0.1"
thiserror = "2.0.21"
proptest = { version = "1.11.0", optional = true }
proptest-derive = { version = "0.9.0", optional = true }
lasso = { version = "0.7.3", features = ["multi-threaded"] }
itertools = "0.15.0"

[features]
arbitrary = ["dep:proptest", "dep:proptest-derive"]

[dev-dependencies]
veles = { path = ".", features = ["arbitrary"] }
insta = "1.49.0"

