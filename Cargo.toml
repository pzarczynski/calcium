[package]
name = "calcium"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
logos = "0.16.1"
rustyline = "18.0.1"
thiserror = "2.0.21"
proptest = { version = "1.11.0", optional = true }
proptest-derive = { version = "0.9.0", optional = true }

[features]
arbitrary = ["dep:proptest", "dep:proptest-derive"]

[dev-dependencies]
calcium = { path = ".", features = ["arbitrary"] }
insta = "1.49.0"

